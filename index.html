        color: #f0f;

    }

        text-align: center;

        height: calc(768px - 65px - 20px);

        margin-right: 12px;
    }

        width: 770px;
        height: 29px;
        /* background-color: aqua; */

        vertical-align: middle;
        font-family: "標楷體";
        font-size: 24px;
        color: #0f0;
        text-align: center;
    }

    iframe {
        width: 770px;
        height: calc(768px - 65px - 29px - 20px);
        background: yellow;
    }

    #footer {
        width: 1000px;
        height: 20px;
        margin: auto;
        clear: both;
        /* background: red; */
        font-family: "標楷體";
        font-size: 16px;
        color: #000;
        text-align: center;
